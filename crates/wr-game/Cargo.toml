[package]
name = "wr-game"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The Bevy app. POC-6 first light: an area pack drawn through Owlcat's own shaders, camera route captures and timings."

[dependencies]
wr-assets.workspace = true
wr-anim.workspace = true
wr-paths.workspace = true
wr-sim = { path = "../wr-sim" }
anyhow.workspace = true
libc.workspace = true
serde_json.workspace = true
bevy = { version = "=0.20.0", default-features = false, features = [
    "default_app",
    "std",
    "multi_threaded",
    "bevy_winit",
    "bevy_window",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_image",
] }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "metal", "wgsl", "parking_lot"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[lints]
workspace = true
