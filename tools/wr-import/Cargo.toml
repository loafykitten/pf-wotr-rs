[package]
name = "wr-import"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Offline importer: reads the game's Unity bundles and writes our own area data (POC-0 spike)."

[dependencies]
wr-paths.workspace = true
wr-assets.workspace = true
texture2ddecoder = "0.1.2"
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
glam = "0.34"
lz4_flex = "0.14"
lzma-rs = "0.3"
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "9.0", default-features = false, features = ["deflate"] }

[lints]
workspace = true
